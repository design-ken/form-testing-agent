name: Lead Form Tester

on:
  schedule:
    - cron: '30 2,12 * * *'   # 8:00 AM and 6:00 PM IST
  # Manual dispatch via the Actions tab's "Run workflow" button occasionally
  # re-ran against a stale commit during initial setup (confirmed live: same
  # old commit hash + resolved deprecation warning both reappeared across
  # repeated manual triggers even after the branch selector showed "main").
  # If that recurs, prefer pushing a real commit to main (which always goes
  # through the scheduled-trigger code path via workflow_dispatch below,
  # freshly reading the workflow file) over repeated manual dispatch clicks.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # needed to commit the updated sqlite file back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Install Playwright Chromium (with retry)
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

      - run: npm run test:forms
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 90
          if-no-files-found: ignore

      # The SQLite file is the durable result store (see src/db.ts) — commit
      # it back to the repo so history persists across runs. Runs even if
      # the test step failed/errored, since insertResults() still writes
      # whatever rows it collected before any failure. Guarded with an
      # existence check: if the process crashed hard (e.g. segfault) before
      # ever reaching insertResults(), the file may not exist yet — `git add`
      # on a nonexistent path fails the whole step otherwise (confirmed live).
      - name: Commit updated test results database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f db/test-runs.sqlite ]; then
            git add db/test-runs.sqlite
            git diff --cached --quiet db/test-runs.sqlite || git commit -m "Update test-runs.sqlite [skip ci]"
            git push
          else
            echo "db/test-runs.sqlite does not exist — test:forms likely crashed before writing any results. Nothing to commit."
          fi
