name: Lead Form Tester

on:
  schedule:
    - cron: '0 1,8,15 * * *'   # 5:30 AM, 1:30 PM, 8:30 PM IST
  # 3-run daily schedule (reduced from 5 on 2026-09-17 — GitHub Actions'
  # schedule trigger is documented "best effort" and was confirmed live to
  # silently drop ~40% of the 5 daily fires, with the ones that did fire
  # landing 38min-2hr+ late; this pattern held for 5+ consecutive days before
  # the change, see Notion run history). 3 well-spaced slots fire far more
  # reliably than 5 clustered ones. Kept the 2 highest-value checkpoints plus
  # an evening sentinel:
  # - 5:30 AM (1 UTC): Overnight health check, 1.5 hrs before morning peak
  # - 1:30 PM (8 UTC): Pre-absolute-peak window (1-2 PM is highest traffic)
  # - 8:30 PM (15 UTC): Evening sentinel before quiet hours
  # Manual dispatch via the Actions tab's "Run workflow" button occasionally
  # re-ran against a stale commit during initial setup (confirmed live: same
  # old commit hash + resolved deprecation warning both reappeared across
  # repeated manual triggers even after the branch selector showed "main").
  # If that recurs, prefer pushing a real commit to main (which always goes
  # through the scheduled-trigger code path via workflow_dispatch below,
  # freshly reading the workflow file) over repeated manual dispatch clicks.
  workflow_dispatch: {}

# Runs queue instead of overlapping: two runs (e.g. a manual one during a scheduled one) both
# write db/test-runs.sqlite, and the second push was being rejected.
concurrency:
  group: run-tests
  cancel-in-progress: false

jobs:
  test:
    # Pinned: ubuntu-latest migrated to 26.04, which Playwright 1.55.1 cannot install
    # Chromium on (confirmed 2026-11-16: every run failed with "does not support chromium
    # on ubuntu26.04-x64"). Revisit when upgrading Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # needed to commit the updated sqlite file back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install Playwright Chromium (with retry)
        timeout-minutes: 10
        run: |
          ok=0
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium webkit firefox; then ok=1; break; fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "Playwright Chromium install failed after 3 attempts"; exit 1; fi

      # Real Microsoft Edge. Kept separate and non-fatal: if this install hangs or fails, the run
      # still tests every other target and simply skips the Edge one (EDGE_INSTALLED stays unset).
      - name: Install Microsoft Edge (optional)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if timeout 420 npx playwright install msedge; then echo "EDGE_INSTALLED=1" >> "$GITHUB_ENV"; else echo "Edge install failed or timed out - Edge target will be skipped"; fi

      - run: npm run test:forms
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 90
          if-no-files-found: ignore

      # Sends a compiled HTML summary via Resend's SMTP relay, reading the
      # run-summary.json that src/run.ts writes at the end of main(). Runs
      # with if: always() because test:forms can exit non-zero (a failed
      # run) while still having written a valid summary — that's exactly
      # the highest-value case to email about. The script itself degrades
      # non-fatally on a missing file or missing secret (see
      # scripts/send_report_email.py), so this never blocks the DB-commit
      # step below. Independent of git-commit success on purpose — email
      # delivery and committing results are unrelated concerns.
      - name: Send email summary
        if: always()
        run: python3 scripts/send_report_email.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Recipients: set the repo variable EMAIL_TO (comma-separated) to change; defaults to Edwerd.
          EMAIL_TO: ${{ vars.EMAIL_TO || 'edwerd@kenresearch.com' }}

      # Regenerates docs/data.json from the just-updated db/test-runs.sqlite,
      # which the GitHub Pages dashboard (docs/index.html) reads client-side.
      # if: always() for the same reason as the email step above: even a
      # failed test:forms run may have inserted partial rows worth reflecting
      # on the dashboard. Guarded like the DB-commit step below: skip if the
      # DB file never got created (hard crash before insertResults()).
      - name: Regenerate dashboard data
        if: always()
        run: |
          if [ -f db/test-runs.sqlite ]; then
            npm run dashboard:export
          else
            echo "db/test-runs.sqlite does not exist — skipping dashboard export."
          fi

      # The SQLite file is the durable result store (see src/db.ts) — commit
      # it back to the repo so history persists across runs, along with the
      # dashboard's regenerated data.json (same commit, so the two never
      # drift apart in git history). Runs even if the test step
      # failed/errored, since insertResults() still writes whatever rows it
      # collected before any failure. Guarded with an existence check: if
      # the process crashed hard (e.g. segfault) before ever reaching
      # insertResults(), the file may not exist yet — `git add` on a
      # nonexistent path fails the whole step otherwise (confirmed live).
      - name: Commit updated test results database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f db/test-runs.sqlite ]; then
            git add db/test-runs.sqlite docs/data.json
            git diff --cached --quiet -- db/test-runs.sqlite docs/data.json || git commit -m "Update test-runs.sqlite and dashboard data [skip ci]"
            git push
          else
            echo "db/test-runs.sqlite does not exist — test:forms likely crashed before writing any results. Nothing to commit."
          fi
